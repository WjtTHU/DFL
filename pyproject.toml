[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "FAB-WIP-ANALYSIS"
version = "0.9.5"
requires-python = ">=3.12"
dependencies = [
  "connectorx>=0.4.3",
  "einops>=0.8.1",
  "fastapi>=0.116.1",
  "httpx>=0.27.0",
  "jinja2>=3.1.6",
  "kneed>=0.8.5",
  "loguru>=0.7.3",
  "matplotlib>=3.10.1",
  "optuna>=4.4.0",
  "ortools>=9.14.6206",
  "plotly>=6.2.0",
  "polars[rtcompat]>=1.30.0",
  "psycopg[binary]>=2.9.10",
  "psycopg-pool>=3.2.5",
  "python-dotenv>=1.2.1",
  "pydantic>=2.11.7",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.13.0",
  "scikit-learn>=1.6.1",
  "seaborn>=0.13.2",
  "tensorboard>=2.20.0",
  "torch>=2.7.0",
  "uvicorn[standard]>=0.35.0",
  "pyarrow>=22.0.0",
  "pyvis>=0.3.2",
  "xlsxwriter>=3.2.9",
]

[tool.uv.build-backend]
module-name = ["wip_api", "wip_analysis", "wip_pred"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google" # Accepts: "google", "numpy", or "pep257".

[dependency-groups]
dev = [
  "py-spy>=0.4.1",
  "snakeviz>=2.2.2",
  "pytest>=8.0.0",
  "statsmodels>=0.14.6",
  "requests>=2.33.1",
  "ipykernel>=7.2.0",
]
