data:
  range:
    snapshot_start: "2024-01-17"
    snapshot_end: "2025-01-01"
  cuts:
    train_end: "2024-08-31"
    val_end: "2024-10-31"

training:
  batch_size: 128
  epochs: 50
  seed: 42
  save_dir: "checkpoints"
  log_dir: "experiments"
  sample_weight:
    lot_equal: false
    rct_inverse_freq: false
    rct_num_bins: 10

loss:
  type: "SmoothL1Loss"  # L1Loss or SmoothL1loss

optimizer:
  type: "AdamW"
  params:
    # lr: 0.0003
    lr: 0.001
    weight_decay: 0.00015

scheduler:
  type: "CosineAnnealingLR"
  warmup_epoch: 10
  params:
    T_max: 40

early_stopping:
  monitor: "val_MAE"
  patience: 30
  min_delta: 0
