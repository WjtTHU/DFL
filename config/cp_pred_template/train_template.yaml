data:
  margin_in_days: 3.0
  range:
    snapshot_start: "2026-01-01"
    snapshot_end: "2026-06-09"
  cuts:
    train_end: "2026-04-30"
    val_end: "2026-05-31"

training:
  batch_size: 128
  epochs: 80
  seed: 42
  save_dir: "checkpoints"
  log_dir: "experiments"

loss:
  type: "SmoothL1Loss"

optimizer:
  type: "AdamW"
  params:
    lr: 0.0001
    weight_decay: 0.00015

scheduler:
  type: "CosineAnnealingLR"
  warmup_epoch: 10
  params:
    T_max: 70

early_stopping:
  monitor: "val_MAE"
  patience: 30
  min_delta: 0
