# Separate research protocol; enterprise YAML and legacy entry points are unchanged.
protocol_version: daily_v1
dataset: dk
timezone: Asia/Shanghai
forecast_start: null
forecast_end_exclusive: null  # Last partially observed calendar day is excluded.
forecast_every_days: 1
train_end: '2024-12-31'
validation_end: '2025-01-28'
window_days: 15
completion_margin_days: 3
distribution_horizon_quantile: 0.95  # Fit only on training integer labels.
seed: 42
batch_size: 128
epochs: 80
patience: 30
threads: 4

