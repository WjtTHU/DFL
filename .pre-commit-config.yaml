repos:
  - repo: local
    hooks:
      - id: normalize-line-endings
        name: Normalize line endings to LF
        entry: perl -pi -e 's/\r\n?/\n/g'
        language: system
        types: [text]

      - id: trim-trailing-whitespace
        name: Trim trailing whitespace
        entry: perl -pi -e 's/[ \t]+$//'
        language: system
        types: [text]

      - id: fix-end-of-file
        name: Fix end of files
        entry: perl -0777 -pi -e 's/\n*\z/\n/ if length'
        language: system
        types: [text]

      - id: ruff-check-fix
        name: Ruff check with fixes
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
